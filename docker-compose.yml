# Сайт и PostgreSQL. Переменные подставляются из окружения: в App Platform Timeweb Cloud —
# из раздела «Переменные» приложения, на своём сервере — из файла .env рядом с этим файлом
# (cp .env.example .env). Отдельный env_file не нужен: .env не хранится в git.
#
#   docker compose up -d                                                  — сайт и база
#   docker compose -f docker-compose.yml -f deploy/caddy.yml up -d        — + HTTPS через Caddy
#
# С управляемой базой Timeweb задайте DATABASE_URL — контейнер postgres тогда не используется.

services:
  site:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://site:site@postgres:5432/site}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      GOLDFISH_URL: ${GOLDFISH_URL:-}
      GOLDFISH_ADMIN_URL: ${GOLDFISH_ADMIN_URL:-}
      GOLDFISH_ADMIN_TOKEN: ${GOLDFISH_ADMIN_TOKEN:-}
      GOLDFISH_CLIENT_ID: ${GOLDFISH_CLIENT_ID:-}
      GOLDFISH_CLIENT_NAME: ${GOLDFISH_CLIENT_NAME:-Сайт}
      EXTENSION_ZIP: ${EXTENSION_ZIP:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Наружу не публикуется: доступна только сайту внутри сети compose.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U site -d site']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
